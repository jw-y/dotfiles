name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whitespace check below diffs HEAD against its parent. The
          # default shallow clone has no parent, so '--root' made it diff
          # against nothing and report every pre-existing space in the repo as
          # newly added. Two commits is all it needs.
          fetch-depth: 2
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # 'bash -n a b c' parses only 'a' — b and c become its positional
      # parameters, so a syntax error in them passes silently. One file at a
      # time is the only form that checks them all.
      - name: Check shell scripts
        run: |
          for f in install.sh update.sh tests/*.test.sh; do
            bash -n "$f"
          done
          shellcheck --severity=warning install.sh update.sh tests/*.test.sh
      # bin/cdx moved here when it was rewritten in Python. Leaving it in the
      # shell lists above turned every push red at 'bash -n', which gates the
      # test run — a lint step that fails on the file it is meant to check is
      # indistinguishable from one that works, right up until you read it.
      - name: Check Python syntax
        run: |
          for f in bin/cdx bin/gmon bin/smux tests/cdx_unit.py; do
            python3 -c "import sys; compile(open(sys.argv[1]).read(), sys.argv[1], 'exec')" "$f"
          done
      - name: Check JSON
        run: |
          python3 -m json.tool claude/settings.json >/dev/null
          python3 -m json.tool nvim/lazy-lock.json >/dev/null
      # The suites sandbox themselves: each builds a throwaway CODEX_PROFILES
      # tree with a stub 'codex' on PATH, and CDX_NO_KILL=1 stops the
      # process-matching tests from signalling anything real.
      - name: Run tests
        run: make test
      - name: Check dry-run safety
        run: |
          HOME="$RUNNER_TEMP/dotfiles-dry-home" DRY_RUN=true ./update.sh
          test ! -e "$RUNNER_TEMP/dotfiles-dry-home"
      - name: Check whitespace
        run: git diff-tree --check --root HEAD
